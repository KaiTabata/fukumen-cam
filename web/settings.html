<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ふくめんカメラ 設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="app">
  <header class="header">
    <h1>ふくめんカメラ 設定</h1>
    <span class="badge" id="sysBadge"><span class="dot"></span><span>確認中</span></span>
    <div class="spacer"></div>
    <div class="header-actions">
      <button class="btn btn-secondary" id="discard" disabled>変更を取り消す</button>
      <button class="btn btn-primary" id="apply" disabled>Zoomに反映<span class="count" id="applyCount" hidden></span></button>
      <button class="btn btn-danger btn-sm" id="quit">システムを終了</button>
    </div>
  </header>

  <div class="banner-slot">
    <div class="banner" id="banner" role="status" hidden>
      <svg class="icon icon-warn" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <svg class="icon icon-ok" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-5-5 1.4-1.4 3.6 3.6 7.6-7.6L19 8l-9 9z"/></svg>
      <div><b id="bannerTitle"></b><p id="bannerText"></p></div>
    </div>
  </div>

  <nav class="nav" aria-label="設定の項目"><ul id="nav"></ul></nav>

  <main class="panel" id="panel" tabindex="-1"></main>

  <aside class="preview" id="previewBox" aria-label="プレビュー">
    <div class="pip-bar"><b>プレビュー</b><button class="btn btn-tertiary btn-xs" id="pipToggle" aria-expanded="true">たたむ</button></div>
    <h2>プレビュー</h2>
    <div class="tabs" role="tablist" id="tabs" aria-label="プレビューする見た目"></div>
    <div class="frame"><iframe id="preview" title="プレビュー画面"></iframe></div>
    <p class="preview-note">反映前の設定で表示しています。Zoomには「Zoomに反映」を押すまで出ません。</p>
    <div class="checks">
      <label class="check"><input type="checkbox" id="demo">喋っている動きを再生する</label>
      <label class="check"><input type="checkbox" id="hud">状態表示を重ねる</label>
    </div>

    <section class="status" aria-label="接続状態">
      <h3>接続状態</h3>
      <dl id="status"><dt>センサー</dt><dd>確認中</dd></dl>
    </section>
  </aside>
</div>

<dialog id="quitDialog">
  <h2>システムを終了しますか？</h2>
  <p>仮想カメラ・声の加工・OBS を停止します。Zoom で使用中の場合は、映像と声が止まります。</p>
  <p>反映していない変更は下書きとして残り、次回も続きから編集できます。</p>
  <div class="dialog-actions">
    <button class="btn btn-secondary" id="quitCancel">キャンセル</button>
    <button class="btn btn-danger-solid" id="quitOk">終了する</button>
  </div>
</dialog>

<script type="module" src="settings-app.js"></script>
</body>
</html>
